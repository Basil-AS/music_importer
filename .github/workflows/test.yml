name: Verify Music Importer

on:
  push:
    branches:
      - 'feature/**'
      - develop
      - master
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          for file in demo/*.js chrome-extension/*.js tests/*.js; do
            node --check "$file"
          done
      - name: Validate extension manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('chrome-extension/manifest.json', 'utf8'))"
      - name: Run fixtures
        run: node --test tests/*.test.js
